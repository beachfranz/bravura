[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bravura"
version = "0.1.0"
description = "Research-led synthetic business demo design"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bravura = "bravura.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
